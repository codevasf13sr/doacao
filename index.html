<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requerimento de Doação – Codevasf 13ª SR</title>
<style>
  :root { --azul:#1F3864; --azul2:#2E5597; --claro:#EEF3FA; --borda:#d5dbe5; --txt:#1d2433; --cinza:#5b6475; --ok:#1e7b45; --alerta:#a85d00; --erro:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:var(--txt); background:#f5f7fb; }
  header { background:var(--azul); color:#fff; padding:14px 20px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:2px 0 0; font-size:13px; opacity:.85; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header a.mod { color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:6px; padding:6px 10px; font-size:13px; text-decoration:none; white-space:nowrap; }
  header a.mod:hover { background:rgba(255,255,255,.12); }
  .proto { background:#fff4d6; color:#6b4a00; font-size:12.5px; padding:6px 20px; border-bottom:1px solid #f0dca6; }
  .wrap { max-width:860px; margin:0 auto; padding:18px 16px 60px; }
  .steps { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:14px; }
  .steps button { flex:1 1 auto; min-width:70px; border:1px solid var(--borda); background:#fff; color:var(--cinza); font-size:12px; padding:6px 6px; border-radius:6px; cursor:pointer; }
  .steps button.on { background:var(--azul2); border-color:var(--azul2); color:#fff; }
  .steps button.done { border-color:#9fc5ae; color:var(--ok); }
  .card { background:#fff; border:1px solid var(--borda); border-radius:10px; padding:20px; }
  .card h2 { margin:0 0 4px; font-size:19px; color:var(--azul); }
  .card .sub { margin:0 0 16px; color:var(--cinza); font-size:14px; }
  h3 { font-size:15px; margin:22px 0 8px; color:var(--azul); border-bottom:1px solid var(--borda); padding-bottom:4px; }
  label.f { display:block; font-size:13.5px; font-weight:600; margin:12px 0 4px; }
  .hint { font-size:12.5px; color:var(--cinza); font-weight:400; }
  input[type=text], input[type=number], input[type=date], input[type=email], input[type=tel], textarea, select { width:100%; padding:9px 10px; border:1px solid #c3cbd8; border-radius:6px; font:inherit; font-size:14.5px; background:#fff; }
  textarea { min-height:78px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:2px solid #9db8e8; border-color:var(--azul2); }
  .row { display:grid; gap:0 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opt { display:flex; align-items:center; gap:8px; border:1px solid #c3cbd8; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:14px; background:#fff; user-select:none; }
  .opt input { margin:0; width:17px; height:17px; accent-color:var(--azul2); }
  .opt.sel { border-color:var(--azul2); background:var(--claro); }
  .opt small { color:var(--alerta); font-size:11.5px; }
  .gcards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .gcard { border:2px solid var(--borda); border-radius:10px; padding:14px; cursor:pointer; background:#fff; }
  .gcard.sel { border-color:var(--azul2); background:var(--claro); }
  .gcard b { font-size:16px; color:var(--azul); }
  .gcard ul { margin:8px 0 0; padding-left:18px; font-size:13px; color:var(--cinza); }
  .msg { font-size:13px; padding:8px 10px; border-radius:6px; margin-top:8px; }
  .msg.ok { background:#e8f5ec; color:var(--ok); }
  .msg.warn { background:#fff4e0; color:var(--alerta); }
  .msg.err { background:#fdecea; color:var(--erro); }
  .bad { border-color:var(--erro) !important; }
  .nav { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.btn { border:0; background:var(--azul2); color:#fff; padding:11px 18px; font-size:15px; border-radius:8px; cursor:pointer; }
  button.btn.sec { background:#e8edf5; color:var(--azul); }
  button.btn.big { width:100%; padding:14px; font-size:16px; margin-top:8px; }
  button.btn:disabled { opacity:.5; cursor:default; }
  .mini { border:1px solid #c3cbd8; background:#fff; border-radius:6px; padding:5px 10px; font-size:13px; cursor:pointer; color:var(--azul); }
  table.lst { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px; }
  table.lst th, table.lst td { border:1px solid var(--borda); padding:6px 8px; text-align:left; }
  table.lst th { background:var(--claro); }
  .dir { display:grid; grid-template-columns: 2fr 1.2fr 1.2fr auto; gap:6px; margin-top:6px; align-items:center; }
  .bem { border:1px solid var(--borda); border-radius:8px; padding:10px 12px; margin-top:8px; }
  .bem .bh { display:flex; align-items:center; gap:10px; }
  .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-top:10px; }
  .ph { border:1px solid var(--borda); border-radius:8px; padding:8px; background:#fafbfd; }
  .ph img { width:100%; height:170px; object-fit:contain; background:#eef1f6; border-radius:4px; }
  .ph .acts { display:flex; gap:6px; margin:6px 0; }
  .ph input { font-size:13px; padding:6px 8px; margin-top:4px; }
    .drop { display:block; margin-top:10px; border:2px dashed #b7c3d6; border-radius:10px; padding:18px; text-align:center; color:var(--cinza); font-size:14px; cursor:pointer; background:#fafbfd; }
  .sum { font-size:14px; }
  .sum dt { font-weight:600; margin-top:8px; }
  .sum dd { margin:2px 0 0; color:var(--cinza); }
  .decl { font-size:13.5px; background:#fafbfd; border:1px solid var(--borda); border-radius:8px; padding:10px 14px; max-height:260px; overflow:auto; }
  .decl p { margin:6px 0; }
  .status { font-size:13.5px; margin-top:10px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.min.js"></script>

</head>
<body>
<header>
  <div><h1>Requerimento de Doação – Codevasf 13ª SR</h1>
  <p>Assistente de preenchimento (Norma N-455)</p></div>
  <a class="mod" id="linkModelos" href="modelos/">📄 Modelos em Word</a>
</header>
<div class="proto" id="faixa">Versão de teste. Os dados digitados ficam só neste navegador e não são enviados a nenhum servidor.</div>
<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="barraNovo"></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <button class="btn sec" id="prev">← Voltar</button>
    <button class="btn sec" id="novo" style="background:#fff;border:1px solid #c3cbd8;font-size:13.5px">🗑 Novo requerimento</button>
    <button class="btn" id="next">Avançar →</button>
  </div>
</div>

<script>
// ---------------------------------------------------------------- dados fixos
const GRUPOS = {
  I:   { anos: 1, assoc: 15, rotulo: 'Grupo I',   txt: 'CNPJ com pelo menos 1 ano e no mínimo 15 associados' },
  II:  { anos: 2, assoc: 30, rotulo: 'Grupo II',  txt: 'CNPJ com pelo menos 2 anos e no mínimo 30 associados' },
  III: { anos: 4, assoc: 45, rotulo: 'Grupo III', txt: 'CNPJ com pelo menos 4 anos e no mínimo 45 associados' },
};
// Tabela 02 do Anexo B: E = elegível; C = elegível condicionalmente (análise especial da Comissão)
const BASE = { I: 'E', II: 'E', III: 'E' };
const TR = { I: 'C', II: 'E', III: 'E' };
// [nome, elegibilidade por grupo (entidade privada), categoria]
const TAB = [
  ['Trator agrícola (somente o trator)', TR, 'Mecanização agrícola'],
  ['Trator agrícola com implementos', TR, 'Mecanização agrícola'],
  ['Implementos agrícolas (para trator que já possui)', TR, 'Mecanização agrícola'],
  ['Microtrator', BASE, 'Mecanização agrícola'],
  ['Ensiladeira / picadeira forrageira', BASE, 'Mecanização agrícola'],
  ['Kit de comercialização (balança, freezers e mesa inox)', BASE, 'Kits e itens de inclusão produtiva'],
  ['Kit de comercialização de pescado', BASE, 'Kits e itens de inclusão produtiva'],
  ['Kit de pecuária leiteira', BASE, 'Kits e itens de inclusão produtiva'],
  ['Kit de beneficiamento de mel', BASE, 'Kits e itens de inclusão produtiva'],
  ['Kit de apicultura', BASE, 'Kits e itens de inclusão produtiva'],
  ['Kit de corte e costura / máquinas de costura', BASE, 'Kits e itens de inclusão produtiva'],
  ['Barracas de feira livre', BASE, 'Kits e itens de inclusão produtiva'],
  ['Outros itens de inclusão produtiva', BASE, 'Kits e itens de inclusão produtiva'],
  ['Equipamentos de irrigação', BASE, 'Água e irrigação'], ['Tubos', BASE, 'Água e irrigação'],
  ['Equipamentos de acumulação de água', BASE, 'Água e irrigação'], ['Equipamentos de dessedentação animal', BASE, 'Água e irrigação'],
  ['Veículo de carga (VLC, ¾, toco ou caminhonete)', TR, 'Veículos'],
  ['Caminhão frigorífico', TR, 'Veículos'],
  ['Caminhão munck (guindauto)', TR, 'Veículos'],
  ['Caminhão basculante toco', TR, 'Veículos'],
  ['Caminhão basculante trucado', { III: 'C' }, 'Veículos'],
  ['Veículo trucado (outros)', { III: 'C' }, 'Veículos'],
  ['Caminhão compactador de resíduos sólidos', { III: 'C' }, 'Veículos'],
  ['Caminhão-pipa', {}, 'Veículos'],
  ['Retroescavadeira', { III: 'E' }, 'Máquinas pesadas (linha amarela)'],
  ['Pá carregadeira', {}, 'Máquinas pesadas (linha amarela)'],
  ['Escavadeira hidráulica', {}, 'Máquinas pesadas (linha amarela)'],
  ['Motoniveladora', {}, 'Máquinas pesadas (linha amarela)'],
  ['Rolo compactador', {}, 'Máquinas pesadas (linha amarela)'],
];
const CAT = Object.fromEntries(TAB.map(x => [x[0], x[2]]));
// título de categoria antes do primeiro bem de cada grupo da lista
const cabCat = (n, i, arr) => { const c = n === '__outro' ? 'Outro' : CAT[n]; const a = i ? (arr[i - 1] === '__outro' ? 'Outro' : CAT[arr[i - 1]]) : null; return c !== a && c !== 'Outro' ? `<h3 style="margin:14px 0 6px">${c}</h3>` : ''; };
const ORD = ['I', 'II', 'III'];
// perfil da entidade: maior grupo que o tempo de CNPJ e o nº de associados permitem (vale o de menor porte)
function PERFIL() {
  const a = anosDesde(S.abertura), n = +S.nAssoc; if (a === null || !S.nAssoc) return '';
  if (a >= 4 && n >= 45) return 'III'; if (a >= 2 && n >= 30) return 'II'; if (a >= 1 && n >= 15) return 'I'; return '';
}
// situação mais favorável para um bem: menor grupo, até o perfil, em que é elegível; se só houver condicional, o menor condicional
function melhor(nome, P = PERFIL()) {
  if (!P) return null; const t = (TAB.find(x => x[0] === nome) || [])[1]; const lim = ORD.indexOf(P);
  if (!t) return { g: P, cond: false };
  for (let i = 0; i <= lim; i++) if (t[ORD[i]] === 'E') return { g: ORD[i], cond: false };
  for (let i = 0; i <= lim; i++) if (t[ORD[i]] === 'C') return { g: ORD[i], cond: true };
  return null;
}
// grupo de exigência do pedido: o maior entre os bens escolhidos (sem bens, vale o perfil)
function GR() {
  const P = PERFIL(); if (!P) return '';
  const sel = Object.entries(S.bens).filter(([n, v]) => v && v.on && (n === '__outro' || melhor(n, P))).map(([n]) => n);
  if (!sel.length) return P;
  let m = 0; for (const n of sel) { const x = n === '__outro' ? { g: P } : melhor(n, P); if (x) m = Math.max(m, ORD.indexOf(x.g)); }
  return ORD[m];
}
// lista exaustiva dos bens de cada grupo, montada da tabela TAB (sempre alinhada com a escolha de bens)
const bensDoGrupo = G => ({ livre: TAB.filter(([, e]) => e[G] === 'E').map(([n]) => n), cond: TAB.filter(([, e]) => e[G] === 'C').map(([n]) => n) });
const ENQ_BENS = Object.fromEntries(['I', 'II', 'III'].map(G => { const b = bensDoGrupo(G); return [G, b.livre.join('; ') + '.' + (b.cond.length ? ' Com análise especial da Comissão de Doação: ' + b.cond.join('; ') + '.' : '')]; }));
const SUPERINTENDENTE = 'Fred Queiroga Pinto';
const VERSAO = 'v2.12 (nov/2026)';
const MODELOS = location.protocol === 'file:' ? 'https://codevasf13sr.github.io/doacao/modelos/index.html' : 'modelos/index.html';

// ---------------------------------------------------------------- estado
const VAZIO = () => ({
  grupo: '', ofNum: '', cidade: '', razao: '', cnpj: '', endereco: '', bairro: '', cep: '', tel: '', email: '', abertura: '', nAssoc: '',
  banco: '', agencia: '', conta: '',
  rNome: '', rCpf: '', rCargo: 'Presidente(a)', rTel: '', rEmail: '',
  diretoria: [{ nome: '', cpf: '', funcao: '' }], mandato: 'Não', mandatoDesc: '',
  bens: {}, outroBem: '', familias: '', pessoas: '', comunidades: '', area: [], distancia: '', vias: '', justificativa: '',
  mulheres: '', famAssoc: '', jovens: '', tamProp: '', estrutura: '', metragem: '',
  atividades: [], ativOutra: '', volume: '', periodicidade: '', sedePropria: '', sedeEnd: '', reunioes: '', arrecadacao: [], possuiMesma: '', possuiDesc: '',
  selecao: '', parcerias: [], parcOutra: '', custeio: [], custeioOutro: '', capac: '', capacDemandas: '',
  gNome: '', gCpf: '', gTel: '', gEmail: '', gEnd: '', gCoord: '',
  assocModo: '', assoc: [{ nome: '', cpf: '' }], nAssocAnexo: '',
  recebeu: '', recebidos: [{ desc: '', fab: '', rec: '', local: '' }], usoTxt: '', benefTxt: '', manutTxt: '',
  docs: [], aceite: false,
});
let TIPO = location.hash === '#publica' ? 'pub' : location.hash === '#privada' ? 'priv' : '';
const CHAVE = () => 'codevasf_req_rascunho_' + (TIPO || 'x');
let S = VAZIO();
let FOTOS = []; // {id, data (dataURL), rot, bem, dataFoto, coord}
function carregar() { S = VAZIO(); if (TIPO === 'pub') S.rCargo = 'Prefeito(a) Municipal'; try { const r = localStorage.getItem(CHAVE()); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) {} if (/^\d{4}-\d{2}-\d{2}$/.test(S.abertura)) S.abertura = dataBR(S.abertura); }
carregar();
const salvar = () => { try { localStorage.setItem(CHAVE(), JSON.stringify(S)); } catch (e) {} };

// ---------------------------------------------------------------- utilidades
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dig = s => String(s || '').replace(/\D/g, '');
function cpfOk(v) { const c = dig(v); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; let s = 0; for (let i = 0; i < 9; i++) s += +c[i] * (10 - i); let d = (s * 10) % 11 % 10; if (d !== +c[9]) return false; s = 0; for (let i = 0; i < 10; i++) s += +c[i] * (11 - i); d = (s * 10) % 11 % 10; return d === +c[10]; }
function cnpjOk(v) { const c = dig(v); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false; const calc = n => { const w = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2]; let s = 0; for (let i = 0; i < n; i++) s += +c[i] * w[i]; const r = s % 11; return r < 2 ? 0 : 11 - r; }; return calc(12) === +c[12] && calc(13) === +c[13]; }
const fmtCpf = v => { const c = dig(v).slice(0, 11); return c.length === 11 ? c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : v; };
const fmtCnpj = v => { const c = dig(v).slice(0, 14); return c.length === 14 ? c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : v; };
function isoDe(d) { if (!d) return ''; const m = String(d).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (m) return `${m[3]}-${m[2]}-${m[1]}`; return /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : ''; }
function anosDesde(d) { d = isoDe(d); if (!d) return null; const a = new Date(d + 'T00:00:00'), h = new Date(); let n = h.getFullYear() - a.getFullYear(); if (h.getMonth() < a.getMonth() || (h.getMonth() === a.getMonth() && h.getDate() < a.getDate())) n--; return n; }
const dataBR = d => !d ? '' : String(d).includes('/') ? d : d.split('-').reverse().join('/');
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const hojeExtenso = () => { const h = new Date(); return `${h.getDate()} de ${MESES[h.getMonth()]} de ${h.getFullYear()}`; };

function associados() { return S.assocModo === 'Digitar' ? (S.assoc || []).filter(x => x.nome.trim() || dig(x.cpf)) : []; }
let ARQ_ASSOC = null; // {name, bytes, paginas, erro} – fica só na memória da página
async function lerAnexoAssoc(f) {
  if (!f) return;
  const bytes = await f.arrayBuffer();
  ARQ_ASSOC = { name: f.name, bytes, paginas: 0, erro: '' };
  try {
    if (!window.PDFLib) throw new Error('lib');
    const d = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
    ARQ_ASSOC.paginas = d.getPageCount();
  } catch (e) { ARQ_ASSOC.erro = e && e.message === 'lib' ? 'A biblioteca de PDF não carregou; recarregue a página.' : 'Não foi possível ler este arquivo como PDF. Gere o PDF novamente (por exemplo, pelo Word: Salvar como PDF) e tente de novo.'; }
  render();
}
function assocResumo() {
  const a = associados(), min = GRUPOS[GR()]?.assoc || 0;
  const inval = a.filter(x => !cpfOk(x.cpf)).length;
  const cpfs = a.map(x => dig(x.cpf)).filter(Boolean); const dup = cpfs.length - new Set(cpfs).size;
  return { n: a.length, min, inval, dup };
}
function anexoMsg() {
  if (!S.nAssocAnexo) return '<div class="msg warn">Informe o número de associados da relação.</div>';
  const min = GRUPOS[GR()]?.assoc || 0, n = +S.nAssocAnexo;
  return n >= min ? `<div class="msg ok">${n} associados: atende ao mínimo do ${GRUPOS[GR()].rotulo} (${min}).</div>` : `<div class="msg warn">${n} associados: o ${GRUPOS[GR()].rotulo} exige no mínimo ${min}.</div>`;
}
function assocMsg() {
  if (S.assocModo !== 'Digitar') return '';
  const r = assocResumo(); const ok = r.n >= r.min && !r.inval && !r.dup;
  return `<div class="msg ${ok ? 'ok' : 'warn'}">${r.n} associado(s) informado(s)${r.min ? ` · mínimo do ${GRUPOS[GR()].rotulo}: ${r.min}` : ''}${r.inval ? ` · <b>${r.inval} CPF(s) inválido(s)</b>` : ''}${r.dup ? ` · <b>${r.dup} CPF(s) repetido(s)</b>` : ''}</div>`;
}
const bensSel = () => Object.entries(S.bens).filter(([n, v]) => v && v.on && (TIPO === 'pub' || n === '__outro' || melhor(n))).map(([n, v]) => ({ nome: n === '__outro' ? (S.outroBem || 'Outro bem') : n, qtd: v.qtd || '1', fin: v.fin || '' }));
const temBem = t => bensSel().some(b => b.nome.toLowerCase().includes(t));

// ---------------------------------------------------------------- componentes de formulário
const txt = (k, label, o = {}) => `<label class="f">${label}${o.hint ? ` <span class="hint">${o.hint}</span>` : ''}</label><input type="${o.type || 'text'}" data-k="${k}" value="${esc(S[k])}" placeholder="${esc(o.ph || '')}" ${o.inputmode ? `inputmode="${o.inputmode}"` : ''}>${o.after || ''}`;
const area = (k, label, o = {}) => `<label class="f">${label}${o.hint ? ` <span class="hint">${o.hint}</span>` : ''}</label><textarea data-k="${k}" placeholder="${esc(o.ph || '')}">${esc(S[k])}</textarea>`;
const radios = (k, label, opts, o = {}) => `<label class="f">${label}${o.hint ? ` <span class="hint">${o.hint}</span>` : ''}</label><div class="opts">${opts.map(v => `<label class="opt ${S[k] === v ? 'sel' : ''}"><input type="radio" name="${k}" data-k="${k}" value="${esc(v)}" ${S[k] === v ? 'checked' : ''}>${esc(v)}</label>`).join('')}</div>`;
const checks = (k, label, opts, o = {}) => `<label class="f">${label}${o.hint ? ` <span class="hint">${o.hint}</span>` : ''}</label><div class="opts">${opts.map(v => `<label class="opt ${S[k].includes(v) ? 'sel' : ''}"><input type="checkbox" data-arr="${k}" value="${esc(v)}" ${S[k].includes(v) ? 'checked' : ''}>${esc(v)}</label>`).join('')}</div>`;

// ---------------------------------------------------------------- etapas
const ETAPAS_PRIV = [
  { t: 'Perfil', f: () => { const P = PERFIL(); return `
    <h2>Perfil da entidade</h2>
    <p class="sub">Informe dois dados do cartão CNPJ e da lista de associados. Com eles, a página identifica os bens que a entidade pode pedir. Na próxima etapa, as exigências serão as do grupo mais favorável para o bem escolhido.</p>
    <div class="row"><div>${txt('abertura', 'Data de abertura do CNPJ', { ph: 'dd/mm/aaaa', inputmode: 'numeric', hint: '(está no cartão CNPJ)' })}</div><div>${txt('nAssoc', 'Número de associados', { type: 'number' })}</div></div>
    <div id="v-perfil">${perfilMsg()}</div>

function pendencias() {
  const p = [], g = GRUPOS[GR()];
  if (!g) p.push('Informar data de abertura do CNPJ e nº de associados que atendam ao Grupo I (etapa Perfil)');
  if (!S.razao) p.push('Razão social'); if (!cnpjOk(S.cnpj)) p.push('CNPJ válido'); if (!S.cidade) p.push('Município');
  if (g && S.abertura && anosDesde(S.abertura) < g.anos) p.push(`Tempo de CNPJ insuficiente para o ${g.rotulo}`);
  if (!S.rNome) p.push('Nome do representante legal'); if (!cpfOk(S.rCpf)) p.push('CPF válido do representante');
  if (!bensSel().length) p.push('Marcar pelo menos um bem (etapa Pedido)');
  if (!S.justificativa) p.push('Justificativa (etapa Pedido)');
  if (GR() !== 'I' && g && !(S.banco && S.agencia && S.conta)) p.push('Dados bancários (obrigatórios no grupo)');
  if (!S.assocModo) p.push('Informar como a relação de associados será apresentada');
  if (S.assocModo === 'Digitar' && g) { const r = assocResumo(); if (r.n < g.assoc) p.push(`Relação com no mínimo ${g.assoc} associados (há ${r.n})`); if (r.inval) p.push(`${r.inval} CPF(s) inválido(s) na relação de associados`); if (r.dup) p.push(`${r.dup} CPF(s) repetido(s) na relação de associados`); }
  if (S.assocModo === 'Anexar PDF' && (!ARQ_ASSOC || ARQ_ASSOC.erro)) p.push('Escolher um PDF legível com a relação de associados');
  if (S.assocModo === 'Anexar PDF' && !S.nAssocAnexo) p.push('Informar quantos associados constam da relação anexada');

function lerExif(buf) {
  try {
    const dv = new DataView(buf); if (dv.getUint16(0) !== 0xFFD8) return {};
    let off = 2;
    while (off < dv.byteLength - 4) {
      const mk = dv.getUint16(off);
      if (mk === 0xFFE1 && dv.getUint32(off + 4) === 0x45786966) return tiff(dv, off + 10);
      if ((mk & 0xFF00) !== 0xFF00) break;
      off += 2 + dv.getUint16(off + 2);
    }
  } catch (e) {}
  return {};
}
function tiff(dv, t) {
  const le = dv.getUint16(t) === 0x4949, g16 = o => dv.getUint16(o, le), g32 = o => dv.getUint32(o, le);
  const sz = { 1: 1, 2: 1, 3: 2, 4: 4, 5: 8, 7: 1, 9: 4, 10: 8 };
  const ifd = o => { const m = {}, n = g16(o); for (let i = 0; i < n; i++) { const e = o + 2 + i * 12, tag = g16(e), type = g16(e + 2), cnt = g32(e + 4); const p = (sz[type] || 1) * cnt > 4 ? t + g32(e + 8) : e + 8; m[tag] = { type, cnt, p }; } return m; };
  const ascii = x => { let s = ''; for (let i = 0; i < x.cnt - 1; i++) s += String.fromCharCode(dv.getUint8(x.p + i)); return s; };
  const rat = p => g32(p) / (g32(p + 4) || 1);
  const out = {}; const i0 = ifd(t + g32(t + 4));
  let dt = null;
  if (i0[0x8769]) { const ex = ifd(t + g32(i0[0x8769].p)); if (ex[0x9003]) dt = ascii(ex[0x9003]); }
  if (!dt && i0[0x0132]) dt = ascii(i0[0x0132]);
  if (dt) { const m = dt.match(/(\d{4}):(\d{2}):(\d{2})/); if (m) out.data = `${m[3]}/${m[2]}/${m[1]}`; }
  if (i0[0x8825]) {
    const gp = ifd(t + g32(i0[0x8825].p));
    if (gp[2] && gp[4]) {
      const dms = x => rat(x.p) + rat(x.p + 8) / 60 + rat(x.p + 16) / 3600;
      let lat = dms(gp[2]), lon = dms(gp[4]);
      if (gp[1] && String.fromCharCode(dv.getUint8(gp[1].p)) === 'S') lat = -lat;
      if (gp[3] && String.fromCharCode(dv.getUint8(gp[3].p)) === 'W') lon = -lon;
      if (lat || lon) out.coord = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
    }
  }
  return out;
}
function carregarImg(src) { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; }); }
async function reduzir(src, rot = 0, max = 1400) {
  const img = await carregarImg(src);
  let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, max / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
  const c = document.createElement('canvas'); const vira = rot % 180 !== 0; c.width = vira ? h : w; c.height = vira ? w : h;
  const x = c.getContext('2d'); x.translate(c.width / 2, c.height / 2); x.rotate(rot * Math.PI / 180); x.drawImage(img, -w / 2, -h / 2, w, h);
  return c.toDataURL('image/jpeg', 0.78);
}
async function addFotos(files) {
  for (const f of Array.from(files || [])) {
    if (FOTOS.length >= 6) break; if (!f.type.startsWith('image/')) continue;
    const buf = await f.arrayBuffer(); const ex = lerExif(buf);
    const url = URL.createObjectURL(f);
    try { const data = await reduzir(url); FOTOS.push({ data, bem: '', dataFoto: ex.data || '', coord: ex.coord || '', auto: !!(ex.data || ex.coord) }); }
    catch (e) { alertaStatus('Não foi possível ler a imagem ' + f.name); }
    URL.revokeObjectURL(url);
  }
  render();
}
async function girar(i) { FOTOS[i].data = await reduzir(FOTOS[i].data, 90); render(); }

const slug = (x, n) => (x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\(.*?\)/g, '').replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '').slice(0, n);
function nomePreenchimento() {

  const pal = b.length ? b[0].nome.replace(/\(.*?\)/g, '').trim().split(/\s+/).slice(0, 3) : [];

  const bem = b.length ? slug(pal.join(' '), 30) + (b.length > 1 ? '_e_outros' : '') : 'sem_bem';

const blocoGuardar = () => `<div class="msg" style="background:#fff;border:1px solid var(--borda);color:var(--txt);margin-top:14px">

  <button class="btn sec big" id="guardarPre" style="margin-top:8px">💾 Salvar preenchimento (para reutilizar)</button></div>`;
async function guardarPreenchimento() {
  const dados = { app: 'codevasf-doacao-13sr', versao: VERSAO, tipo: TIPO, salvoEm: new Date().toISOString(), dados: S };
  const msg = await salvarArquivo(nomePreenchimento(), new Blob([JSON.stringify(dados, null, 1)], { type: 'application/json' }));
  alertaStatus(msg === 'Arquivo gerado.' || msg === 'Arquivo salvo.' ? 'Preenchimento salvo. Para usar de novo, abra o formulário e clique em “Abrir preenchimento salvo”.' : msg);
}
function abrirPreenchimento(f) {
  const r = new FileReader();
  r.onload = () => {
    let j; try { j = JSON.parse(r.result); } catch (e) { j = null; }
    if (!j || j.app !== 'codevasf-doacao-13sr' || !j.dados || !['pub', 'priv'].includes(j.tipo)) { alert('Este arquivo não é um preenchimento salvo por este formulário.'); return; }
    const d = Object.assign({}, j.dados, { aceite: false });
    try { localStorage.setItem('codevasf_req_rascunho_' + j.tipo, JSON.stringify(d)); } catch (e) {}
    window._avisoVisto = true;
    window._carregado = (d.razao || 'entidade') + (j.salvoEm ? ' (salvo em ' + new Date(j.salvoEm).toLocaleDateString('pt-BR') + ')' : '');
    const h = j.tipo === 'pub' ? '#publica' : '#privada';
    if (location.hash === h) { FOTOS = []; ARQ_ASSOC = null; carregar(); atual = 0; cabecalho(); render(); } else location.hash = h;
  };
  r.readAsText(f);
}
async function salvarArquivo(nome, blob) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: nome, data: blob }); return 'Arquivo salvo.'; }
    }
  } catch (e) { if (e && e.code === 'declined') return 'Download cancelado.'; if (e && e.code === 'rate_limited') return 'Aguarde um instante e tente de novo.'; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return 'Arquivo gerado.';
}
function gerar(tipo) {
  if (!window.pdfMake) { alertaStatus('<span style="color:var(--erro)">A biblioteca de PDF não carregou. Verifique a conexão e recarregue a página.</span>'); return; }
  alertaStatus('Gerando PDF…');
  const def = TIPO === 'pub' ? (tipo === 'req' ? docRequerimentoPub() : tipo === 'res' ? docResiduos() : docPlanoPub()) : (tipo === 'req' ? docRequerimento() : docPlano());
  const base = (S.razao || 'entidade').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').slice(0, 40);
  const nome = (tipo === 'req' ? 'Requerimento_Doacao_' : tipo === 'res' ? 'Plano_Residuos_Solidos_' : 'Plano_de_Uso_') + base + '.pdf';
  pdfMake.createPdf(def).getBuffer(async buf => {
    try {
      let bytes = buf;
      if (TIPO === 'priv' && tipo === 'plano' && S.assocModo === 'Anexar PDF' && ARQ_ASSOC && !ARQ_ASSOC.erro) {
        const base = await PDFLib.PDFDocument.load(buf);
        const anexo = await PDFLib.PDFDocument.load(ARQ_ASSOC.bytes, { ignoreEncryption: true });
        const pags = await base.copyPages(anexo, anexo.getPageIndices());
        pags.forEach(p => base.addPage(p));
        bytes = await base.save();
      }
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const r = await salvarArquivo(nome, blob);
      alertaStatus(`${r} (${nome}, ${(blob.size / 1024).toFixed(0)} KB)`);
    } catch (e) { alertaStatus('<span style="color:var(--erro)">Não foi possível montar o PDF com a relação anexada. Tente gerar o PDF da relação novamente.</span>'); }
  });
}

};
const QORD = Object.keys(QDEF);
// questionário técnico: só entidades públicas (nas privadas, as informações são coletadas na visita técnica)
function blocosQ() { if (TIPO !== 'pub') return []; const s = new Set(); bensSel().forEach(b => (QBEM[b.nome] || []).forEach(q => s.add(q))); return QORD.filter(q => s.has(q)); }
// campos de caixas de seleção dos quais outras perguntas dependem (exigem redesenhar a tela)
const QDEP = new Set(Object.values(QDEF).flatMap(d => d.itens.filter(it => it.se).map(it => it.se[0])));
const qLabel = it => typeof it.l === 'function' ? it.l(TIPO === 'pub') : it.l;
const qVisivel = it => {
  if (it.pub && TIPO !== 'pub') return false;
  if (it.priv && TIPO === 'pub') return false;
  if (it.bem && !bensSel().some(b => it.bem.includes(b.nome))) return false;
  if (!it.se) return true;
  const [k, val] = it.se, r = S[k], alvo = Array.isArray(val) ? val : [val];
  return Array.isArray(r) ? r.some(x => alvo.includes(x)) : alvo.includes(r);
};
function qCampo(it) {
  const l = qLabel(it);
  if (it.t === 'nota') return `<div class="msg" style="margin:8px 0">${l}</div>`;
  if (it.t === 'radio') return radios(it.k, l, it.o);
  if (it.t === 'checks') { if (!Array.isArray(S[it.k])) S[it.k] = []; return checks(it.k, l, it.o); }
  if (it.t === 'area') return area(it.k, l);
  return txt(it.k, l, { type: it.t === 'num' ? 'number' : 'text', ph: it.ph });
}
function etapaQuestionario() {
  const bl = blocosQ();
  if (!bl.length) return `<h2>Questionário técnico</h2><div class="msg ok">Os bens escolhidos não têm questionário específico. Pode avançar.</div>`;
  return `<h2>Questionário técnico</h2><p class="sub">Perguntas específicas sobre o(s) bem(ns) pedido(s). As respostas serão anexadas ao Plano de Uso.</p>
    ${bl.map(b => { const d = QDEF[b]; return `<h3>${d.titulo}</h3>${d.itens.filter(qVisivel).map(qCampo).join('')}`; }).join('')}
    <h3>Responsável pelas informações técnicas</h3>
    <p class="hint">Opcional: indique quem pode esclarecer dúvidas da área técnica (${QDEF[bl[0]].resp}).</p>
    <div class="row"><div>${txt('qResp', 'Nome')}</div><div>${txt('qRespCargo', 'Cargo')}</div><div>${txt('qRespTel', 'Telefone', { type: 'tel' })}</div></div>
    ${area('qOutras', 'Outras informações que queira destacar (opcional)')}`;
}
function anexoQuestionario(c) {
  const bl = blocosQ(); if (!bl.length) return;
  c.push({ text: 'ANEXO – QUESTIONÁRIO TÉCNICO DO BEM', bold: true, alignment: 'center', fontSize: 11, pageBreak: 'before' });
  c.push({ text: `${v(S.razao)} – CNPJ ${v(S.cnpj)}`, alignment: 'center', margin: [0, 2, 0, 6] });
  bl.forEach(b => {
    const d = QDEF[b];
    c.push(barra(d.titulo.toUpperCase()));
    const linhas = d.itens.filter(it => it.t !== 'nota' && qVisivel(it)).map(it => { const r = S[it.k]; const val = Array.isArray(r) ? (r.length ? r.join(', ') : '') : r; return [{ text: qLabel(it), bold: true, fontSize: 8.8 }, { text: v(val), fontSize: 8.8 }]; });
    c.push(grade(linhas, [230, '*']));
  });
  c.push(barra('RESPONSÁVEL PELAS INFORMAÇÕES TÉCNICAS'));
  c.push(grade([[{ text: 'Nome / cargo / telefone', bold: true }, `${v(S.qResp)} / ${v(S.qRespCargo)} / ${v(S.qRespTel)}`], [{ text: 'Outras informações', bold: true }, v(S.qOutras)]], [230, '*']));
}

[ETAPAS_PUB].forEach(E => { const i = E.findIndex(e => e.t === 'Plano de uso'); E.splice(i + 1, 0, { t: 'Questionário', f: etapaQuestionario }); });
